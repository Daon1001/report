name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run syntax check
      run: |
        python -c "from parsers.excel_parser import parse_balance_sheet"
        python -c "from parsers.pdf_parser import parse_company_overview"
        python -c "from parsers.financial_ratios import calculate_ratios"
        python -c "from report.html_template import generate_report_html"
        python -c "from report.pdf_generator import generate_pdf"
        echo "All imports successful"
